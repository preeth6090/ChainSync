name: Scheduled sweeps

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://chainsync-two.vercel.app/api/cron")
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "Cron endpoint returned $status"
            exit 1
          fi

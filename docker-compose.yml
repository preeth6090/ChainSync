services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainsync}
      POSTGRES_DB: chainsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chainsync']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Always points at the "postgres" service by its Compose network name, regardless of
      # whatever DATABASE_URL is set to in .env — that value is for running the app outside
      # Docker (npm run dev) against a differently-reachable database.
      DATABASE_URL: postgresql://chainsync:${POSTGRES_PASSWORD:-chainsync}@postgres:5432/chainsync
      AUTH_SECRET: ${AUTH_SECRET}
      EMAIL_SERVER: ${EMAIL_SERVER}
      EMAIL_FROM: ${EMAIL_FROM}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - '3000:3000'
    volumes:
      # Dispatch/dispute photos are written to local disk (see lib/services/file-storage.ts)
      # — this keeps them across container rebuilds/restarts.
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
